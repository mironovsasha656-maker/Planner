<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финансовый планировщик</title>
<meta name="description" content="Финансовый планировщик 2026–2031: траты, лимит и накопления из Excel-файла.">
<meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one-column phone app shell — sticky header, scrolling screen, fixed bottom tab bar.
   Palette: treasury navy from the Excel planner + ledger-gold highlight; semantic green/red only for limit status. */
:root {
  --bg: #f5f4ed;
  --surface: #fdfcf8;
  --surface-2: #efede4;
  --ink: #1f1e1d;
  --ink-2: #524f49;
  --muted: #7d786e;
  --line: #e2dfd3;
  --navy: #b85432;
  --accent: #b85432;
  --gold: #8a6410;
  --gold-soft: #f7ecc9;
  --good: #3f7d52;
  --good-soft: #e2f0e4;
  --bad: #c04a44;
  --bad-soft: #f8e4e0;
  --out: #b9b2a2;
  --hero-bg: #2b2926;
  --hero-ink: #fdfcf8;
  --hero-ink-2: #c9c2b3;
  --hero-track: rgba(255,255,255,.16);
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.05);
  /* categorical, fixed order (validated reference ramp) + neutral for «Прочее» */
  --c1: #b85432; --c2: #e3b04b; --c3: #7b5e4a; --c4: #4a8c5e;
  --c5: #c9788f; --c6: #6a5aa8; --c7: #d98b3a; --c8: #4a93a8; --c9: #9a9384;

  --f-display: "Source Serif 4", Georgia, "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", "Roboto", "SamsungOne", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card: 18px;
  --r-chip: 999px;
  --tabbar-h: 64px;
  --on-navy: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b19; --surface: #262523; --surface-2: #2f2d2a; --ink: #f0eee6; --ink-2: #b9b5a9; --muted: #8c877b; --line: #3a3835; --navy: #e08865; --accent: #e08865; --gold: #e3b04b; --gold-soft: #3d3117; --good: #6cbf86; --good-soft: #1f3326; --bad: #f0857e; --bad-soft: #3d211e; --out: #5a564e; --hero-bg: #3a2b23; --hero-ink: #fdfcf8; --hero-ink-2: #d9c3b6; --on-navy: #1c1b19; 
    --hero-track: rgba(255,255,255,.14); --shadow: none;
    --c1: #e08865; --c2: #e3b04b; --c3: #a58469; --c4: #6cbf86; --c5: #d98aa0; --c6: #a597e0; --c7: #e59a4d; --c8: #6cb4c8; --c9: #8c877b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b19; --surface: #262523; --surface-2: #2f2d2a; --ink: #f0eee6; --ink-2: #b9b5a9; --muted: #8c877b; --line: #3a3835; --navy: #e08865; --accent: #e08865; --gold: #e3b04b; --gold-soft: #3d3117; --good: #6cbf86; --good-soft: #1f3326; --bad: #f0857e; --bad-soft: #3d211e; --out: #5a564e; --hero-bg: #3a2b23; --hero-ink: #fdfcf8; --hero-ink-2: #d9c3b6; --on-navy: #1c1b19; 
  --hero-track: rgba(255,255,255,.14); --shadow: none;
  --c1: #e08865; --c2: #e3b04b; --c3: #a58469; --c4: #6cbf86; --c5: #d98aa0; --c6: #a597e0; --c7: #e59a4d; --c8: #6cb4c8; --c9: #8c877b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.num, .tnum { font-variant-numeric: tabular-nums; }

.app { max-width: 520px; margin: 0 auto; min-height: 100%; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  padding: 12px 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: var(--r-chip); cursor: pointer;
  padding: 10px 16px; font-weight: 600; font-size: 14px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--navy); color: var(--on-navy); border-color: transparent; }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .mswitch button:focus-visible, .day-row:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn-icon { padding: 10px; }

/* ---------- screens ---------- */
main { padding: 4px 16px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.screen-title { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.15; margin: 6px 0 0; text-wrap: balance; }
.screen-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card { background: var(--surface); border-radius: var(--r-card); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-t { font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.card-note { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.banner {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  background: var(--gold-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px;
  border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
}
.banner b { font-weight: 600; }
.banner .btn { padding: 8px 12px; font-size: 13px; flex: none; }
.warnbox { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; }
.fresh { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- hero ---------- */
.hero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 22px; padding: 18px 18px 16px; position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -40px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
  border: 28px solid rgba(255,255,255,.05); pointer-events: none;
}
.hero-k { font-size: 12.5px; color: var(--hero-ink-2); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.hero-v { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin-top: 8px; font-variant-numeric: tabular-nums; }
.hero-v .cur { font-size: 26px; font-weight: 600; margin-left: 4px; opacity: .85; }
.hero-cap { color: var(--hero-ink-2); font-size: 14px; margin-top: 6px; }
.hero-cap b { color: var(--hero-ink); font-weight: 600; }
.meter { height: 10px; border-radius: 99px; background: var(--hero-track); overflow: hidden; margin-top: 14px; position: relative; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
.meter-legend { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--hero-ink-2); margin-top: 8px; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-bad { background: var(--bad-soft); color: var(--bad); }
.pill-neutral { background: var(--surface-2); color: var(--ink-2); }
.hero .pill-good { background: rgba(67,194,127,.18); color: #7fe0a8; }
.hero .pill-bad { background: rgba(242,113,106,.2); color: #ffb0aa; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile-k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile-v { font-size: 21px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.tile-s { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* key-value list */
.kv { display: flex; flex-direction: column; }
.kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.kv-row:first-child { border-top: 0; padding-top: 2px; }
.kv-row .k { color: var(--ink-2); font-size: 14px; min-width: 0; }
.kv-row .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- month switcher ---------- */
.mswitch { display: flex; align-items: center; gap: 8px; }
.mswitch button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; flex: none; }
.mswitch button:disabled { opacity: .35; cursor: default; }
.mswitch button svg { width: 18px; height: 18px; }
.mswitch .mname { flex: 1; min-width: 0; text-align: center; }
.mswitch .mname .screen-title { margin: 0; font-size: 20px; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--f-body); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 130px; max-width: 220px;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.35;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); font-variant-numeric: tabular-nums;
}
.tip b { font-weight: 650; }
.tip .tr { display: flex; justify-content: space-between; gap: 12px; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.ln { height: 2px; width: 14px; border-radius: 1px; }

/* ---------- segmented / chips ---------- */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { white-space: nowrap; border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 99px; padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--ink-2);
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 28%, transparent); background: var(--surface-2); font-weight: 600; }
.chip[aria-pressed="false"] .dot { opacity: .35; }

/* ---------- category bars ---------- */
.cats { display: flex; flex-direction: column; gap: 12px; }
.cat-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.cat-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 550; }
.cat-name .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; }
.tag-in { background: var(--good-soft); color: var(--good); }
.tag-out { background: var(--gold-soft); color: var(--gold); }
.cat-val { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
.cat-val small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.cat-bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cat-bar i { display: block; height: 100%; border-radius: 99px; }
.split { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 4px 0 10px; }
.split i { display: block; height: 100%; }

/* ---------- day list ---------- */
.days { display: flex; flex-direction: column; }
.day-row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
  padding: 10px 2px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%;
}
.day-row:first-child { border-top: 0; }
.day-d { display: flex; flex-direction: column; line-height: 1.1; }
.day-d b { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.day-d span { font-size: 12px; color: var(--muted); }
.day-mid { min-width: 0; }
.day-bar { height: 6px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.day-bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; }
.day-bar .lim { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); opacity: .5; }
.day-meta { font-size: 12.5px; color: var(--muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-r { text-align: right; }
.day-r b { font-variant-numeric: tabular-nums; font-weight: 650; display: block; }
.day-r .pill { margin-top: 3px; font-size: 11.5px; padding: 1px 8px; }
.day-row.empty .day-d b { color: var(--muted); }
.day-row.future { cursor: default; opacity: .55; }
.day-detail { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 2px 62px; }
.day-detail span { font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 4px 8px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }

/* ---------- milestones ---------- */
.ms { display: flex; flex-direction: column; gap: 0; }
.ms-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.ms-row:first-child { border-top: 0; }
.ms-mark { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--navy); }
.ms-row.done .ms-mark { background: var(--navy); }
.ms-row.goal .ms-mark { border-color: var(--gold); }
.ms-row.goal.done .ms-mark { background: var(--gold); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border-radius: 14px; cursor: pointer; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.tab svg { width: 24px; height: 24px; }
.tab .ic { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 99px; transition: background .2s; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .ic { background: color-mix(in srgb, var(--navy) 16%, transparent); color: var(--navy); }

/* ---------- welcome / states ---------- */
.welcome { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); }
.steps li::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; z-index: 40;
  max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.loading { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; z-index: 50; font-weight: 600; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--navy); animation: sp 0.9s linear infinite; margin: 0 auto 10px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .tab .ic { transition: none; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }


/* ---------- v1.2 motion ---------- */
.hero-v, .tile-v, .screen-title, .kv-row .v { font-family: var(--f-display); }
.hero::after { animation: drift 8s ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(-10px,8px) scale(1.06); } }
@keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slideNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slidePrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes rowIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes popIn { 0% { opacity: 0; transform: scale(0); } 70% { opacity: 1; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }
@keyframes fadeFrom { from { opacity: 0; } to { opacity: 1; } }
@keyframes tabPop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
#main.enter > * { animation: riseIn .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(min(var(--n, 0), 8) * 55ms); }
#main.enter.dir-next > * { animation-name: slideNext; animation-duration: .5s; }
#main.enter.dir-prev > * { animation-name: slidePrev; animation-duration: .5s; }
#main.enter .tile, #main.enter .cat-row, #main.enter .day-row, #main.enter .kv-row, #main.enter .ms-row {
  animation: rowIn .6s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(min(var(--n, 0), 8) * 55ms + 120ms); }
#main.enter svg .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms + 180ms); }
#main.enter svg .ln-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawLine 1.1s ease-out .18s forwards; }
#main.enter svg .dot-pop { transform-box: fill-box; transform-origin: center; animation: popIn .5s cubic-bezier(.34,1.56,.64,1) 1.05s both; }
#main.enter svg .fade { animation: fadeFrom .8s ease both; animation-delay: calc(var(--i, 0) * 70ms + 300ms); }
.tab.pop .ic svg { animation: tabPop .4s cubic-bezier(.34,1.56,.64,1); }
@media (prefers-reduced-motion: reduce) {
  #main.enter > *, #main.enter .tile, #main.enter .cat-row, #main.enter .day-row, #main.enter .kv-row, #main.enter .ms-row,

<script>
/* ================= XLSX reader (no dependencies) =================
   .xlsx = zip + XML. We read the values Excel cached for every formula,
   so the app shows exactly what Excel showed when the file was saved. */
class AppError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }

function readZipIndex(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new AppError('not-zip', 'Это не файл Excel (.xlsx).');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder();
  const entries = new Map();
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    entries.set(td.decode(u8.subarray(p + 46, p + 46 + nlen)), { method, csize, lho });
    p += 46 + nlen + xlen + clen;
  }
  return { u8, dv, entries };
}

async function zipText(z, name) {
  const e = z.entries.get(name);
  if (!e) return null;
  const nlen = z.dv.getUint16(e.lho + 26, true), xlen = z.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + xlen;
  const data = z.u8.subarray(start, start + e.csize);
  let out;
  if (e.method === 0) out = data;
  else if (e.method === 8) {
    if (typeof DecompressionStream === 'undefined') throw new AppError('old-browser', 'Браузер слишком старый: обновите Chrome или Samsung Internet.');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    out = new Uint8Array(await new Response(stream).arrayBuffer());
  } else throw new AppError('zip-method', 'Файл сжат необычным способом. Пересохраните его в Excel.');
  return new TextDecoder().decode(out);
}

const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
function xml(text) { return new DOMParser().parseFromString(text, 'application/xml'); }
function kids(el, name) { return Array.from(el.childNodes).filter(n => n.nodeType === 1 && n.localName === name); }
function kid(el, name) { return kids(el, name)[0] || null; }

function siText(si) {
  let s = '';
  for (const n of si.childNodes) {
    if (n.nodeType !== 1) continue;
    if (n.localName === 't') s += n.textContent;
    else if (n.localName === 'r') { const t = kid(n, 't'); if (t) s += t.textContent; }
  }
  return s;
}

async function openWorkbook(buf) {
  const z = readZipIndex(buf);
  const wbText = await zipText(z, 'xl/workbook.xml');
  if (!wbText) throw new AppError('not-xlsx', 'В файле нет книги Excel. Нужен .xlsx, сохранённый в Excel.');
  const wb = xml(wbText);
  const relsDoc = xml(await zipText(z, 'xl/_rels/workbook.xml.rels') || '<Relationships/>');
  const rel = {};
  for (const r of relsDoc.getElementsByTagNameNS('*', 'Relationship')) {
    let t = r.getAttribute('Target') || '';
    t = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
    rel[r.getAttribute('Id')] = t;
  }
  const sheets = Array.from(wb.getElementsByTagNameNS('*', 'sheet')).map(s => ({
    name: s.getAttribute('name'),
    path: rel[s.getAttributeNS(RNS, 'id') || s.getAttribute('r:id')]
  }));
  const sstText = await zipText(z, 'xl/sharedStrings.xml');
  const sst = sstText ? Array.from(xml(sstText).getElementsByTagNameNS('*', 'si')).map(siText) : [];
  const stats = { formulas: 0, uncached: 0 };

  async function sheet(name) {
    const s = sheets.find(x => x.name === name);
    if (!s || !s.path) return null;
    const doc = xml(await zipText(z, s.path));
    const cells = new Map();
    for (const c of doc.getElementsByTagNameNS('*', 'c')) {
      const r = c.getAttribute('r');
      const t = c.getAttribute('t');
      const vEl = kid(c, 'v');
      if (kid(c, 'f')) { stats.formulas++; if (!vEl) stats.uncached++; }
      let v = null;
      if (t === 's') v = vEl ? (sst[+vEl.textContent] ?? null) : null;
      else if (t === 'str') v = vEl ? vEl.textContent : null;
      else if (t === 'inlineStr') { const is = kid(c, 'is'); v = is ? siText(is) : null; }
      else if (t === 'b') v = vEl ? vEl.textContent === '1' : null;
      else if (t === 'e') v = null;
      else if (vEl) { const n = parseFloat(vEl.textContent); v = Number.isFinite(n) ? n : null; }
      if (r) cells.set(r, v);
    }
    return cells;
  }
  return { sheetNames: sheets.map(s => s.name), sheet, stats };
}

/* ================= Planner model ================= */
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTH_RE = new RegExp('^(' + MONTHS.join('|') + ')\\s+(\\d{4})$');

function colL(i) { let s = ''; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function norm(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim().toLowerCase(); }
function num(v) { return typeof v === 'number' && Number.isFinite(v) ? v : null; }
function serialToISO(n) {
  if (typeof n !== 'number') return null;
  const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000);
  return d.toISOString().slice(0, 10);
}
function isDateSerial(v) { return typeof v === 'number' && v > 30000 && v < 80000; }

function findLabel(cells, col, re, rows = 60) {
  for (let r = 1; r <= rows; r++) {
    const v = cells.get(col + r);
    if (typeof v === 'string' && re.test(norm(v))) return r;
  }
  return 0;
}

function extractSettings(cells) {
  const s = {};
  const pick = (re) => { const r = findLabel(cells, 'A', re, 40); return r ? cells.get('B' + r) : null; };
  s.start = serialToISO(pick(/^дата начала/));
  s.end = serialToISO(pick(/^дата окончания/));
  s.dailySave = num(pick(/^ежедневное пополнение/));
  s.rate = num(pick(/^годовая процентная ставка/));
  s.dailyNorm = num(pick(/^дневной норматив/));
  s.subsDaily = num(pick(/^ежедневный платёж за подписки|^ежедневный платеж за подписки/));
  s.obligatory = num(pick(/^обязательные списания/));
  s.free = num(pick(/^свободно на день/));
  s.goal = num(pick(/^цель/));
  s.cats = [];
  // category list: header «Категории расходов», optional flag column next to it
  for (let ci = 1; ci <= 12; ci++) {
    const L = colL(ci);
    const r = findLabel(cells, L, /^категории расходов/, 10);
    if (!r) continue;
    const FL = colL(ci + 1);
    const hasFlag = /лимит/.test(norm(cells.get(FL + r)));
    for (let rr = r + 1; rr < r + 30; rr++) {
      const name = cells.get(L + rr);
      if (typeof name !== 'string' || !name.trim()) break;
      const flag = hasFlag ? norm(cells.get(FL + rr)) : 'да';
      s.cats.push({ name: name.trim(), inLimit: flag !== 'нет' });
    }
    break;
  }
  return s;
}

function extractSavings(cells) {
  if (!cells) return [];
  const hr = findLabel(cells, 'A', /^месяц$/, 10);
  if (!hr) return [];
  const map = {};
  for (let ci = 1; ci <= 12; ci++) {
    const h = norm(cells.get(colL(ci) + hr));
    if (h === 'дней') map.days = colL(ci);
    else if (h.startsWith('пополнение')) map.contrib = colL(ci);
    else if (h.startsWith('проценты за')) map.interest = colL(ci);
    else if (h.startsWith('баланс после')) map.balance = colL(ci);
    else if (h.startsWith('всего внесено')) map.contribCum = colL(ci);
    else if (h.startsWith('всего заработано')) map.interestCum = colL(ci);
  }
  const rows = [];
  for (let r = hr + 1; r < hr + 200; r++) {
    const name = cells.get('A' + r);
    if (typeof name !== 'string' || !name.trim()) break;
    const m = MONTH_RE.exec(name.trim());
    rows.push({
      name: name.trim(),
      key: m ? `${m[2]}-${String(MONTHS.indexOf(m[1]) + 1).padStart(2, '0')}` : null,
      days: num(cells.get(map.days + r)),
      contrib: num(cells.get(map.contrib + r)),
      interest: num(cells.get(map.interest + r)),
      balance: num(cells.get(map.balance + r)),
      contribCum: num(cells.get(map.contribCum + r)),
      interestCum: num(cells.get(map.interestCum + r)),
    });
  }
  return rows.filter(r => r.key);
}

const PANEL_KEYS = [
  ['normPerDay', /^норматив на день/], ['obligPerDay', /^обязательные в день/], ['freePerDay', /^свободно на день/],
  ['onHand', /на руках сейчас/], ['fromDate', /считать остаток с даты/], ['useIncome', /учитывать доходы/],
  ['enoughUntil', /^денег хватает по дату/], ['coveredDays', /^дней покрыто/], ['needMore', /^нужно доложить/],
  ['planSaveMonth', /^план накоплений за месяц/], ['factSaveMonth', /^фактически накоплено/], ['incomeMonth', /^доходы за месяц/],
  ['spentAll', /^потрачено всего|^фактически потрачено/], ['avgLimit', /^средний расход/], ['savedTotal', /^накоплено с начала периода/],
  ['interestMonth', /^проценты за месяц/], ['balanceEnd', /^баланс счёта на конец|^баланс счета на конец/], ['spentLimit', /^из них в дневном лимите/],
];

function extractMonth(name, cells, settings) {
  const g = a => cells.get(a);
  const m = MONTH_RE.exec(name);
  const key = `${m[2]}-${String(MONTHS.indexOf(m[1]) + 1).padStart(2, '0')}`;
  let hr = 0;
  for (let r = 1; r <= 8; r++) if (norm(g('A' + r)) === 'дата') { hr = r; break; }
  if (!hr) return null;
  const cols = {};
  for (let ci = 1; ci <= 24; ci++) {
    const L = colL(ci), h = norm(g(L + hr));
    if (!h) continue;
    if (h === 'дата') cols.date = L;
    else if (h.startsWith('день недели')) cols.wd = L;
    else if (h.startsWith('план накоплен')) cols.planSave = L;
    else if (h.startsWith('факт накоплен')) cols.factSave = L;
    else if (h.startsWith('доходы')) cols.income = L;
    else if (h.startsWith('факт расходов')) {
      if (h.includes('авто') && !h.includes('весь')) cols.limit = L;
      else if (h.includes('весь')) cols.all = L;
      else cols.single = L;
    }
    else if (h.startsWith('статус')) cols.status = L;
  }
  if (!cols.all) cols.all = cols.single || cols.limit;
  if (!cols.limit) cols.limit = cols.single || cols.all;
  const days = [];
  for (let r = hr + 1; r < hr + 40; r++) {
    const d = g(cols.date + r);
    if (!isDateSerial(d)) break;
    const val = (L) => L ? num(g(L + r)) : null;
    days.push({
      serial: d, date: serialToISO(d), wd: cols.wd ? g(cols.wd + r) : null,
      planSave: val(cols.planSave), factSave: val(cols.factSave), income: val(cols.income),
      all: val(cols.all), limit: val(cols.limit), status: cols.status ? g(cols.status + r) : null, cats: null,
    });
  }
  // panel (label in P, value in R)
  const panel = {};
  for (let r = 1; r <= 45; r++) {
    const lab = norm(g('P' + r));
    if (!lab) continue;
    for (const [k, re] of PANEL_KEYS) if (panel[k] === undefined && re.test(lab)) { panel[k] = g('R' + r); break; }
  }
  for (const k of ['fromDate', 'enoughUntil']) panel[k] = isDateSerial(panel[k]) ? serialToISO(panel[k]) : null;
  // category table
  let catNames = [], catFlags = [];
  let tr = 0;
  for (let r = hr + days.length; r < hr + days.length + 30; r++) {
    const v = g('A' + r);
    if (typeof v === 'string' && /^расходы по категориям/i.test(v.trim())) { tr = r; break; }
  }
  if (tr) {
    const h = tr + 1;
    const catCols = [];
    for (let ci = 3; ci <= 20; ci++) {
      const L = colL(ci), t = g(L + h);
      if (typeof t !== 'string' || !t.trim() || /лимите|всего|итого/i.test(t)) break;
      catCols.push(L); catNames.push(t.trim());
    }
    let d0 = h + 1;
    const hasFlags = /^учёт|^учет/.test(norm(g('A' + d0)));
    if (hasFlags) { catFlags = catCols.map(L => norm(g(L + d0)) !== 'отдельно'); d0++; }
    else catFlags = catNames.map(n => { const c = settings.cats.find(x => x.name === n); return c ? c.inLimit : true; });
    const bySerial = new Map(days.map(d => [d.serial, d]));
    for (let r = d0; r < d0 + 40; r++) {
      const d = g('A' + r);
      if (!isDateSerial(d)) break;
      const day = bySerial.get(d);
      if (!day) continue;
      const vals = catCols.map(L => num(g(L + r)));
      day.cats = vals.some(v => v != null) ? vals : null;
    }
  }
  // stale-cache guard: category entries exist but the day total is empty
  let staleDays = 0;
  for (const d of days) {
    if (d.cats && d.all == null) {
      staleDays++;
      d.all = d.cats.reduce((a, v) => a + (v || 0), 0);
      d.limit = d.cats.reduce((a, v, i) => a + (catFlags[i] ? (v || 0) : 0), 0);
    }
  }
  const banner = g('A2');
  return {
    name, key, archive: typeof banner === 'string' && /архив/i.test(banner),
    days, panel, catNames, catFlags, staleDays,
  };
}

async function parsePlanner(buf, fileName) {
  const wb = await openWorkbook(buf);
  if (!wb.sheetNames.includes('Настройки')) throw new AppError('not-planner', 'В файле нет листа «Настройки». Это точно финансовый планировщик?');
  const settings = extractSettings(await wb.sheet('Настройки'));
  const savings = extractSavings(await wb.sheet('Накопления'));
  const months = [];
  for (const n of wb.sheetNames) {
    if (!MONTH_RE.test(n)) continue;
    const mo = extractMonth(n, await wb.sheet(n), settings);
    if (mo) months.push(mo);
  }
  if (!months.length) throw new AppError('no-months', 'Не нашёл месячных листов вида «Сентябрь 2026».');
  months.sort((a, b) => a.key.localeCompare(b.key));
  const staleDays = months.reduce((a, m) => a + m.staleDays, 0);
  const uncachedShare = wb.stats.formulas ? wb.stats.uncached / wb.stats.formulas : 0;
  return {
    v: 1, fileName, loadedAt: new Date().toISOString(),
    settings, savings, months,
    quality: { uncachedShare, staleDays },
  };
}

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const NBSP = ' ', MINUS = '−';
const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const fmt = n => n == null ? '—' : nf0.format(Math.round(n)).replace('-', MINUS);
const rub = n => n == null ? '—' : fmt(n) + NBSP + '₽';
const signed = n => n == null ? '—' : (n > 0 ? '+' : n < 0 ? MINUS : '') + nf0.format(Math.abs(Math.round(n)));
const compact = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return nf2.format(+(n / 1e6).toFixed(a >= 1e7 ? 1 : 2)) + NBSP + 'млн';
  if (a >= 1e4) return nf0.format(Math.round(n / 1e3)) + NBSP + 'тыс';
  return nf0.format(Math.round(n));
};
const GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const SHORT = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const pd = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m, d, wd: new Date(Date.UTC(y, m - 1, d)).getUTCDay() }; };
const dayLong = iso => { const p = pd(iso); return `${p.d} ${GEN[p.m - 1]}`; };
const dateRu = iso => { if (!iso) return '—'; const p = pd(iso); return `${String(p.d).padStart(2, '0')}.${String(p.m).padStart(2, '0')}.${p.y}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const todayISO = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
const CAT_VARS = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8','--c9'];
function catColor(name, idx) { return /^прочее$/i.test(name) ? 'var(--c9)' : `var(${CAT_VARS[Math.min(idx, 7)]})`; }

/* ================= storage ================= */
const KEY = 'planner.model.v1', UI_KEY = 'planner.ui.v1';
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ================= demo data (clearly marked) ================= */
function demoModel() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const settings = {
    start: '2026-09-01', end: '2031-07-23', dailySave: 570, rate: 0.1521, dailyNorm: 1333, subsDaily: 62, obligatory: 632, free: 701, goal: 760000,
    cats: [['Еда',1],['Транспорт',1],['Развлечения',1],['Одежда',0],['Покупки',0],['Здоровье',0],['Образование',0],['Подписки',0],['Прочее',1]].map(([name, f]) => ({ name, inLimit: !!f })),
  };
  const t = new Date();
  let y = t.getFullYear(), mo = t.getMonth() + 1;
  if (`${y}-${String(mo).padStart(2, '0')}` < '2026-10') { y = 2026; mo = 10; }
  const keys = [];
  for (let k = 1; k >= 0; k--) { let mm = mo - k, yy = y; if (mm < 1) { mm += 12; yy--; } keys.push([yy, mm]); }
  const months = keys.map(([yy, mm], idx) => {
    const n = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
    const upto = idx === 0 ? n : Math.max(3, Math.min(n, t.getDate() - 1));
    const days = [];
    for (let d = 1; d <= n; d++) {
      const iso = `${yy}-${String(mm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      let cats = null;
      if (d <= upto) {
        cats = [Math.round(180 + rnd() * 620), rnd() < .5 ? [62, 124, 150][Math.floor(rnd() * 3)] : null, rnd() < .18 ? Math.round(150 + rnd() * 450) : null,
          rnd() < .04 ? Math.round(1500 + rnd() * 2500) : null, rnd() < .1 ? Math.round(400 + rnd() * 2200) : null, rnd() < .06 ? Math.round(300 + rnd() * 1500) : null,
          null, d === 10 ? 1890 : null, rnd() < .08 ? Math.round(50 + rnd() * 300) : null];
      }
      const all = cats ? cats.reduce((a, v) => a + (v || 0), 0) : null;
      const limit = cats ? cats.reduce((a, v, i) => a + (settings.cats[i].inLimit ? (v || 0) : 0), 0) : null;
      days.push({ date: iso, wd: null, planSave: 570, factSave: 570, income: rnd() < .15 ? Math.round(900 + rnd() * 700) : null, all, limit, status: null, cats });
    }
    const spentAll = days.reduce((a, d) => a + (d.all || 0), 0);
    return {
      name: `${MONTHS[mm - 1]} ${yy}`, key: `${yy}-${String(mm).padStart(2, '0')}`, archive: false, days,
      panel: { freePerDay: 701, normPerDay: 1333, onHand: idx === 1 ? 24500 : null, enoughUntil: null, needMore: idx === 1 ? 6100 : null,
        planSaveMonth: 570 * n, factSaveMonth: 570 * n, incomeMonth: days.reduce((a, d) => a + (d.income || 0), 0), spentAll },
      catNames: settings.cats.map(c => c.name), catFlags: settings.cats.map(c => c.inLimit), staleDays: 0,
    };
  });
  const savings = [];
  let bal = 0, cc = 0, ic = 0;
  for (let yy = 2026, mm = 9; `${yy}-${String(mm).padStart(2, '0')}` <= '2031-07'; mm++) {
    if (mm > 12) { mm = 1; yy++; }
    const n = yy === 2031 && mm === 7 ? 23 : new Date(Date.UTC(yy, mm, 0)).getUTCDate();
    const contrib = n * 570; const before = bal + contrib; const interest = before * 0.1521 / 12; bal = before + interest; cc += contrib; ic += interest;
    savings.push({ name: `${MONTHS[mm - 1]} ${yy}`, key: `${yy}-${String(mm).padStart(2, '0')}`, days: n, contrib, interest, balance: bal, contribCum: cc, interestCum: ic });
  }
  return { v: 1, demo: true, fileName: 'пример', loadedAt: new Date().toISOString(), settings, savings, months, quality: { uncachedShare: 0, staleDays: 0 } };
}

/* ================= derived numbers ================= */
function monthStats(m, settings) {
  const free = num(m.panel.freePerDay) ?? settings.free ?? 0;
  let last = -1;
  m.days.forEach((d, i) => { if (d.all != null) last = i; });
  const upto = m.days.slice(0, last + 1);
  const sum = (arr, f) => arr.reduce((a, d) => a + (f(d) || 0), 0);
  const spentAll = sum(m.days, d => d.all), spentLimit = sum(m.days, d => d.limit);
  const emptyDays = upto.filter(d => d.all == null).length;
  const budget = free * upto.length;
  const cats = m.catNames.map((name, i) => ({
    name, idx: i, inLimit: m.catFlags[i] !== false,
    total: m.days.reduce((a, d) => a + ((d.cats && d.cats[i]) || 0), 0),
  }));
  return {
    free, lastIdx: last, lastDate: last >= 0 ? m.days[last].date : null, elapsed: upto.length, emptyDays,
    spentAll, spentLimit, spentOut: spentAll - spentLimit, budget, dev: budget - spentLimit,
    income: sum(m.days, d => d.income), planSave: sum(m.days, d => d.planSave), factSave: sum(m.days, d => d.factSave),
    avgLimit: upto.length ? spentLimit / upto.length : 0,
    overDays: upto.filter(d => d.limit != null && d.limit > free).length,
    cats,
  };
}
const hasData = m => m.days.some(d => d.all != null);

/* ================= state ================= */
const state = { model: null, tab: 'obzor', monthKey: null, catMode: 'cum', catOff: {}, openDay: null };

function defaultMonthKey(model) {
  const cur = todayISO().slice(0, 7);
  const curM = model.months.find(m => m.key === cur);
  if (curM && hasData(curM)) return cur;
  const withData = model.months.filter(hasData);
  if (withData.length) return withData[withData.length - 1].key;
  return curM ? cur : model.months[0].key;
}
const curMonth = () => state.model.months.find(m => m.key === state.monthKey) || state.model.months[0];

/* ================= charts (hand-drawn SVG) ================= */
function niceMax(v, ticks = 4) {
  if (v <= 0) return { max: ticks, step: 1 };
  const raw = v / ticks, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw);
  return { max: step * Math.ceil(v / step), step };
}
function roundTopRect(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function attachTip(host, n, xAt, html) {
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
  const cross = host.querySelector('.xhair');
  let active = -1;
  const show = (clientX) => {
    const rect = host.getBoundingClientRect();
    const x = clientX - rect.left;
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) { const dx = Math.abs(xAt(i) - x); if (dx < bd) { bd = dx; best = i; } }
    const content = html(best);
    if (!content) { tip.hidden = true; if (cross) cross.style.opacity = 0; return; }
    active = best;
    tip.innerHTML = content; tip.hidden = false;
    const tw = tip.offsetWidth, px = xAt(best);
    tip.style.left = Math.max(0, Math.min(rect.width - tw, px - tw / 2)) + 'px';
    tip.style.top = (-tip.offsetHeight - 8) + 'px';
    if (cross) { cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.style.opacity = 1; }
    host.dispatchEvent(new CustomEvent('tipindex', { detail: best }));
  };
  const hide = () => { tip.hidden = true; active = -1; if (cross) cross.style.opacity = 0; host.dispatchEvent(new CustomEvent('tipindex', { detail: -1 })); };
  host.addEventListener('pointerdown', e => show(e.clientX));
  host.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) show(e.clientX); });
  host.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  document.addEventListener('pointerdown', e => { if (!host.contains(e.target) && active >= 0) hide(); });
}

/* Daily spending: in-limit part (green / red vs limit) + outside-limit part stacked on top */
function dailyChart(host, m, st) {
  const W = host.clientWidth || 340, H = 190, L = 38, R = 6, T = 10, B = 24;
  const n = m.days.length, pw = W - L - R, ph = H - T - B;
  const vals = m.days.map(d => [d.limit || 0, Math.max(0, (d.all || 0) - (d.limit || 0))]);
  const { max, step } = niceMax(Math.max(st.free * 1.25, ...vals.map(v => v[0] + v[1])));
  const y = v => T + ph - (v / max) * ph;
  const band = pw / n, bw = Math.min(14, band * 0.66);
  const xc = i => L + band * i + band / 2;
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">${compact(v)}</text>`;
  }
  let bars = '';
  m.days.forEach((d, i) => {
    if (d.all == null) return;
    const [a, b] = vals[i], x = xc(i) - bw / 2;
    const over = a > st.free;
    const hA = Math.max(a > 0 ? 2 : 0, (a / max) * ph), hB = (b / max) * ph;
    if (b > 0) {
      bars += `<path d="${roundTopRect(x, y(0) - hA - hB, bw, Math.max(0, hB - 2), 3)}" style="fill:var(--out)"/>`;
      if (a > 0) bars += `<rect x="${x}" y="${y(0) - hA}" width="${bw}" height="${hA}" style="fill:var(${over ? '--bad' : '--good'})"/>`;
    } else if (a > 0) {
      bars += `<path d="${roundTopRect(x, y(0) - hA, bw, hA, 3)}" style="fill:var(${over ? '--bad' : '--good'})"/>`;
    }
  });
  const ticks = [1, 5, 10, 15, 20, 25, n].filter((v, i, a) => v <= n && a.indexOf(v) === i && !(v === 25 && n - 25 < 3));
  const xl = ticks.map(t => `<text x="${xc(t - 1)}" y="${H - 6}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${t}</text>`).join('');
  const ly = y(st.free);
  const limitLine = `<line x1="${L}" x2="${W - R}" y1="${ly}" y2="${ly}" style="stroke:var(--gold)" stroke-width="1.5"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Расходы по дням за ${esc(m.name)}">
    ${g}${bars}${limitLine}${xl}
    <line class="xhair" x1="0" x2="0" y1="${T}" y2="${T + ph}" style="stroke:var(--ink-2);opacity:0" stroke-width="1"/>
  </svg>`;
  attachTip(host, n, xc, i => {
    const d = m.days[i];
    if (d.all == null) return `<b>${dayLong(d.date)}</b><div class="muted">нет записей</div>`;
    const dev = st.free - (d.limit || 0);
    return `<b>${dayLong(d.date)}</b>
      <div class="tr"><span><i class="sw" style="background:var(${(d.limit || 0) > st.free ? '--bad' : '--good'})"></i>из лимита</span><span>${rub(d.limit)}</span></div>
      ${d.all - d.limit > 0 ? `<div class="tr"><span><i class="sw" style="background:var(--out)"></i>вне лимита</span><span>${rub(d.all - d.limit)}</span></div>` : ''}
      <div class="tr"><span>к лимиту</span><span>${signed(dev)}</span></div>`;
  });
}

/* Generic multi-line chart with crosshair tooltip */
function lineChart(host, { labels, series, H = 200, yFmt = compact, xTicks, tipTitle, marker = null, area = null }) {
  const W = host.clientWidth || 340, L = 44, R = 8, T = 12, B = 24;
  const n = labels.length, pw = W - L - R, ph = H - T - B;
  const all = series.flatMap(s => s.values.filter(v => v != null));
  const { max, step } = niceMax(Math.max(1, ...all));
  const x = i => L + (n === 1 ? pw / 2 : (pw * i) / (n - 1));
  const y = v => T + ph - (v / max) * ph;
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">${yFmt(v)}</text>`;
  }
  const xl = (xTicks || []).map(([i, t]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="10.5" style="fill:var(--muted)">${t}</text>`).join('');
  let paths = '';
  if (area) {
    const s = series[area.index];
    let d = '', started = false, first = 0, lastI = 0;
    s.values.forEach((v, i) => { if (v == null) return; if (!started) { d += `M${x(i)},${y(0)}L${x(i)},${y(v)}`; started = true; first = i; } else d += `L${x(i)},${y(v)}`; lastI = i; });
    if (started) paths += `<path d="${d}L${x(lastI)},${y(0)}Z" style="fill:${s.color};opacity:.1"/>`;
  }
  if (marker != null && marker >= 0 && marker < n) {
    paths += `<line x1="${x(marker)}" x2="${x(marker)}" y1="${T}" y2="${T + ph}" style="stroke:var(--gold)" stroke-width="1.5"/>
      <text x="${x(marker) + (marker > n * 0.7 ? -5 : 5)}" y="${T + 10}" font-size="10.5" font-weight="600" text-anchor="${marker > n * 0.7 ? 'end' : 'start'}" style="fill:var(--ink-2)">сейчас</text>`;
  }
  for (const s of series) {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i) + ',' + y(v); pen = true; });
    paths += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`;
    let li = -1; s.values.forEach((v, i) => { if (v != null) li = i; });
    if (li >= 0 && s.endDot !== false) paths += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" style="fill:${s.color};stroke:var(--surface)" stroke-width="2"/>`;
  }
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}${paths}${xl}
    <line class="xhair" x1="0" x2="0" y1="${T}" y2="${T + ph}" style="stroke:var(--ink-2);opacity:0" stroke-width="1"/></svg>`;
  attachTip(host, n, x, i => {
    const rows = series.filter(s => s.values[i] != null && !s.noTip).map(s => `<div class="tr"><span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}</span><span>${rub(s.values[i])}</span></div>`).join('');
    if (!rows) return '';
    return `<b>${esc(tipTitle(i))}</b>${rows}`;
  });
}

function monthGen(name) { const m = MONTH_RE.exec(name); return m ? `${GEN[MONTHS.indexOf(m[1])]} ${m[2]}` : name; }

function afterObzor() {
  const host = $('#chMonths');
  if (!host) return;
  const ms = state.model.months.filter(hasData);
  const W = host.clientWidth || 340, H = 170, L = 44, R = 6, T = 12, B = 24, pw = W - L - R, ph = H - T - B;
  const data = ms.map(m => { const s = monthStats(m, state.model.settings); return { m, a: s.spentLimit, b: s.spentOut }; });
  const { max, step } = niceMax(Math.max(...data.map(d => d.a + d.b)));
  const y = v => T + ph - (v / max) * ph;
  const band = pw / data.length, bw = Math.min(24, band * 0.55), xc = i => L + band * i + band / 2;
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" style="fill:var(--muted)">${compact(v)}</text>`;
  let bars = '';
  data.forEach((d, i) => {
    const x = xc(i) - bw / 2, hA = (d.a / max) * ph, hB = (d.b / max) * ph;
    if (d.b > 0) { bars += `<path d="${roundTopRect(x, y(0) - hA - hB, bw, Math.max(0, hB - 2), 4)}" style="fill:var(--out)"/><rect x="${x}" y="${y(0) - hA}" width="${bw}" height="${hA}" style="fill:var(--navy)"/>`; }
    else bars += `<path d="${roundTopRect(x, y(0) - hA, bw, hA, 4)}" style="fill:var(--navy)"/>`;
    bars += `<text x="${xc(i)}" y="${y(d.a + d.b) - 6}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--ink)">${compact(d.a + d.b)}</text>`;
    bars += `<text x="${xc(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${SHORT[+d.m.key.slice(5) - 1]} ${d.m.key.slice(2, 4)}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Траты по месяцам">${g}${bars}<line class="xhair" x1="0" x2="0" y1="${T}" y2="${T + ph}" style="stroke:var(--ink-2);opacity:0"/></svg>`;
  attachTip(host, data.length, xc, i => `<b>${esc(data[i].m.name)}</b><div class="tr"><span><i class="sw" style="background:var(--navy)"></i>из лимита</span><span>${rub(data[i].a)}</span></div><div class="tr"><span><i class="sw" style="background:var(--out)"></i>из отложенных</span><span>${rub(data[i].b)}</span></div>`);
}

/* ================= app shell ================= */
const SCREENS = {
  obzor: [screenObzor, afterObzor], mesyac: [screenMesyac, afterMesyac],
  kategorii: [screenKategorii, afterKategorii], nakopleniya: [screenNakopleniya, afterNakopleniya],
};
let enterTimer, countRaf = [];
const REDUCED = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function clearEnter(main) {
  clearTimeout(enterTimer);
  countRaf.forEach(cancelAnimationFrame); countRaf = [];
  main.classList.remove('enter', 'dir-next', 'dir-prev');
}
/* stagger: --n on top-level blocks and rows; chart marks get --i and animation hooks */
function stagger(main) {
  [...main.children].forEach((el, i) => el.style.setProperty('--n', i));
  main.querySelectorAll('.tile, .cat-row, .day-row, .kv-row, .ms-row').forEach((el, i) => el.style.setProperty('--n', i % 9));
  main.querySelectorAll('svg').forEach(svg => {
    let bi = 0, fi = 0;
    svg.querySelectorAll('rect[style*="fill:var"], path[style*="fill:var"]:not([opacity])').forEach(el => {
      if (el.closest('.tip') || /fill:var\(--(surface|line)\)/.test(el.getAttribute('style') || '')) return;
      el.classList.add('bar'); el.style.setProperty('--i', bi++);
    });
    svg.querySelectorAll('path[fill="none"][stroke-width]').forEach(el => { el.setAttribute('pathLength', '1'); el.classList.add('ln-draw'); });
    svg.querySelectorAll('circle[r]').forEach(el => el.classList.add('dot-pop'));
    svg.querySelectorAll('text').forEach(el => { if (el.getAttribute('text-anchor') === 'middle' && el.getAttribute('font-weight')) { el.classList.add('fade'); el.style.setProperty('--i', fi++); } });
  });
}
/* count-up for pure numbers ("12 345 ₽", "+1 200"); text with dates/words is left alone */
function countUp(main) {
  main.querySelectorAll('.hero-v, .tile-v, .kv-row .v').forEach(el => {
    const node = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.nodeValue));
    if (!node) return;
    const m = node.nodeValue.match(/^([^\d]{0,2})(\d[\d\s\u00a0]*\d|\d)([\s\u00a0]*[^\d\s]{0,3})?$/);
    if (!m) return;
    const end = parseInt(m[2].replace(/[\s\u00a0]/g, ''), 10);
    if (!(end > 0) || end > 1e12) return;
    const text = node.nodeValue, t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min((now - t0) / dur, 1);
      const e = p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2;
      node.nodeValue = p >= 1 ? text : m[1] + nf0.format(Math.round(end * e)) + (m[3] || '');
      if (p < 1) countRaf.push(requestAnimationFrame(step));
    };
    countRaf.push(requestAnimationFrame(step));
  });
}
function render(anim = false, dir = 0) {
  const main = $('#main');
  clearEnter(main);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  if (!state.model) { main.innerHTML = welcome(); if (anim && !REDUCED()) { stagger(main); main.classList.add('enter'); enterTimer = setTimeout(() => main.classList.remove('enter'), 2200); } return; }
  const [scr, after] = SCREENS[state.tab];
  main.innerHTML = scr();
  after();
  if (anim && !REDUCED()) {
    stagger(main);
    main.classList.add('enter');
    if (dir < 0) main.classList.add('dir-prev'); else if (dir > 0) main.classList.add('dir-next');
    countUp(main);
    enterTimer = setTimeout(() => main.classList.remove('enter', 'dir-next', 'dir-prev'), 2200);
  }
  const sub = $('#brandSub');
  if (sub) sub.textContent = state.model.demo ? 'Пример данных' : (state.model.fileName || 'Накопительный счёт 2026–2031');
}
function welcome() {
  return `<div class="welcome">
    <h1 class="screen-title">Финансы из Excel — на экране телефона</h1>
    <ol class="steps"><li>Сохраните планировщик в Excel после правок.</li><li>Перешлите файл на телефон: в «Избранное» Телеграма, на Яндекс Диск или в Google Диск.</li><li>Нажмите «Загрузить файл» и выберите его. Данные останутся в памяти телефона и откроются без интернета.</li></ol>
    <button class="btn btn-primary" data-act="upload" type="button">Загрузить файл</button>
    <button class="btn" data-act="demo" type="button">Посмотреть на примере</button></div>`;
}
let toastTimer;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}
function saveUI() { store.set(UI_KEY, { tab: state.tab, catMode: state.catMode, catOff: state.catOff }); }
function setModel(model, fromFile) {
  state.model = model;
  state.monthKey = defaultMonthKey(model);
  state.openDay = null;
  if (fromFile) {
    const ok = store.set(KEY, model);
    const withData = model.months.filter(hasData);
    const last = withData.length ? monthStats(withData[withData.length - 1], model.settings).lastDate : null;
    toast(ok ? `Загружено. Данные по ${last ? dayLong(last) : '—'}.` : 'Загружено, но память браузера недоступна: после закрытия файл придётся загрузить снова.');
  }
  render(true);
}

async function handleFile(file) {
  if (!file) return;
  const ov = document.createElement('div');
  ov.className = 'loading'; ov.innerHTML = '<div><div class="spin"></div>Читаю файл…</div>';
  document.body.appendChild(ov);
  try {
    const buf = await file.arrayBuffer();
    const model = await parsePlanner(buf, file.name);
    setModel(model, true);
  } catch (e) {
    console.error(e);
    toast(e instanceof AppError ? e.message : 'Не получилось прочитать файл. Проверьте, что это .xlsx из Excel.');
  } finally { ov.remove(); }
}

function init() {
  const ui = store.get(UI_KEY) || {};
  const hash = (location.hash || '').slice(1);
  state.tab = SCREENS[hash] ? hash : (SCREENS[ui.tab] ? ui.tab : 'obzor');
  state.catMode = ui.catMode === 'day' ? 'day' : 'cum';
  state.catOff = ui.catOff || {};
  const saved = store.get(KEY);
  setModel(saved && saved.v === 1 ? saved : demoModel(), false);

  $('#btnUpload').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
  document.querySelector('.tabbar').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    state.tab = b.dataset.tab; saveUI(); render(true); window.scrollTo(0, 0);
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  });
  $('#main').addEventListener('click', e => {
    const a = e.target.closest('[data-act],[data-day],[data-cat],[data-mode]');
    if (!a) return;
    const ms = state.model?.months || [];
    const i = ms.findIndex(m => m.key === state.monthKey);
    if (a.dataset.act === 'upload') $('#fileInput').click();
    else if (a.dataset.act === 'demo') setModel(demoModel(), false);
    else if (a.dataset.act === 'mprev' && i > 0) { state.monthKey = ms[i - 1].key; state.openDay = null; render(true, -1); }
    else if (a.dataset.act === 'mnext' && i < ms.length - 1) { state.monthKey = ms[i + 1].key; state.openDay = null; render(true, 1); }
    else if (a.dataset.act === 'tab') { state.tab = a.dataset.tab; saveUI(); render(true); window.scrollTo(0, 0); }
    else if (a.dataset.day) { state.openDay = state.openDay === a.dataset.day ? null : a.dataset.day; const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (a.dataset.cat) { state.catOff[a.dataset.cat] = !state.catOff[a.dataset.cat]; saveUI(); afterKategorii(); a.setAttribute('aria-pressed', String(!state.catOff[a.dataset.cat])); }
    else if (a.dataset.mode) { state.catMode = a.dataset.mode; saveUI(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  });
  let rw = window.innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - rw) > 20) { rw = window.innerWidth; render(); } });
}
init();


if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
</body>
</html>
